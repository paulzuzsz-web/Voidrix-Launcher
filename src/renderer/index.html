<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' app:; img-src 'self' app: vximg: data: https:; style-src 'self' app: 'unsafe-inline'; script-src 'self' app:; font-src 'self' app: data:; connect-src 'self' app:; object-src 'none'; base-uri 'none'; form-action 'none';"
    />
    <title>Voidrix Launcher</title>
    <link rel="stylesheet" href="/styles/theme.css" />
    <link rel="stylesheet" href="/styles/components.css" />
    <link rel="stylesheet" href="/styles/views.css" />
  </head>
  <body>
    <!-- Hintergrund: Aurora + Raster + Rauschen -->
    <div class="backdrop" aria-hidden="true">
      <span class="aurora aurora--1"></span>
      <span class="aurora aurora--2"></span>
      <span class="aurora aurora--3"></span>
      <span class="backdrop__grid"></span>
      <span class="vignette"></span>
    </div>

    <!-- Eigene Titelleiste (Fenster ist rahmenlos) -->
    <header class="titlebar" id="titlebar">
      <div class="titlebar__drag">
        <div class="brand brand--sm">
          <span class="brand__mark" aria-hidden="true">
            <svg viewBox="0 0 32 32"><use href="#i-void" /></svg>
          </span>
          <span class="brand__text">VOIDRIX</span>
          <span class="brand__sub">LAUNCHER</span>
        </div>
      </div>
      <div class="titlebar__actions">
        <button class="winbtn" id="btn-min" title="Minimieren" aria-label="Minimieren">
          <svg viewBox="0 0 12 12"><path d="M2 6h8" /></svg>
        </button>
        <button class="winbtn" id="btn-max" title="Maximieren" aria-label="Maximieren">
          <svg viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7" rx="1" /></svg>
        </button>
        <button class="winbtn winbtn--close" id="btn-close" title="Schließen" aria-label="Schließen">
          <svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6" /></svg>
        </button>
      </div>
    </header>

    <!-- Ladebildschirm -->
    <div class="boot" id="boot">
      <div class="boot__mark">
        <svg viewBox="0 0 32 32"><use href="#i-void" /></svg>
      </div>
      <div class="boot__bar"><span></span></div>
      <p class="boot__text">Voidrix wird gestartet…</p>
    </div>

    <!-- Ersteinrichtung: Datenordner wählen -->
    <main class="auth" id="setup-screen" hidden></main>

    <!-- Anmeldung / Registrierung -->
    <main class="auth" id="auth-screen" hidden></main>

    <!-- Der eigentliche Launcher -->
    <div class="shell" id="shell" hidden>
      <nav class="rail" id="rail"></nav>
      <div class="content">
        <div class="topbar" id="topbar"></div>
        <main class="view" id="view" tabindex="-1"></main>
      </div>
    </div>

    <div class="toasts" id="toasts" aria-live="polite"></div>
    <div class="modal-root" id="modal-root"></div>

    <!-- Icon-Sprite -->
    <svg class="sprite" aria-hidden="true">
      <defs>
        <symbol id="i-void" viewBox="0 0 32 32">
          <path
            d="M16 2.6 29 8.2v9.1c0 6.4-5.3 10.9-13 14.1C8.3 28.2 3 23.7 3 17.3V8.2L16 2.6Z"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linejoin="round"
          />
          <path d="M10 11.5 16 23l6-11.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
        </symbol>
        <symbol id="i-store" viewBox="0 0 24 24">
          <path d="M4 7h16l-1 4.2A3 3 0 0 1 16 13.6H8a3 3 0 0 1-3-2.4L4 7Z" />
          <path d="M6 13.6V20h12v-6.4" />
          <path d="M9 7V5a3 3 0 0 1 6 0v2" />
        </symbol>
        <symbol id="i-library" viewBox="0 0 24 24">
          <rect x="3" y="4" width="7" height="7" rx="1.6" />
          <rect x="14" y="4" width="7" height="7" rx="1.6" />
          <rect x="3" y="14" width="7" height="7" rx="1.6" />
          <rect x="14" y="14" width="7" height="7" rx="1.6" />
        </symbol>
        <symbol id="i-globe" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="8.5" />
          <path d="M3.5 12h17" />
          <path d="M12 3.5c2.2 2.3 3.4 5.3 3.4 8.5S14.2 18.2 12 20.5c-2.2-2.3-3.4-5.3-3.4-8.5S9.8 5.8 12 3.5Z" />
        </symbol>
        <symbol id="i-download" viewBox="0 0 24 24">
          <path d="M12 4v12" />
          <path d="m7.5 11.5 4.5 4.5 4.5-4.5" />
          <path d="M4 15v3.5A2.5 2.5 0 0 0 6.5 21h11a2.5 2.5 0 0 0 2.5-2.5V15" />
        </symbol>
        <symbol id="i-upload" viewBox="0 0 24 24">
          <path d="M12 16V4" />
          <path d="m7.5 8.5 4.5-4.5 4.5 4.5" />
          <path d="M4 15v3.5A2.5 2.5 0 0 0 6.5 21h11a2.5 2.5 0 0 0 2.5-2.5V15" />
        </symbol>
        <symbol id="i-users" viewBox="0 0 24 24">
          <circle cx="9" cy="8" r="3.4" />
          <path d="M3.5 20a5.5 5.5 0 0 1 11 0" />
          <path d="M16 5.2a3.4 3.4 0 0 1 0 6.6" />
          <path d="M17.5 14.6A5.5 5.5 0 0 1 20.5 20" />
        </symbol>
        <symbol id="i-settings" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="3.2" />
          <path d="M12 2.8v2.4M12 18.8v2.4M21.2 12h-2.4M5.2 12H2.8M18.5 5.5 16.8 7.2M7.2 16.8 5.5 18.5M18.5 18.5 16.8 16.8M7.2 7.2 5.5 5.5" />
        </symbol>
        <symbol id="i-play" viewBox="0 0 24 24">
          <path d="M8 5.5v13l11-6.5-11-6.5Z" fill="currentColor" stroke="none" />
        </symbol>
        <symbol id="i-stop" viewBox="0 0 24 24">
          <rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor" stroke="none" />
        </symbol>
        <symbol id="i-folder" viewBox="0 0 24 24">
          <path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4l2 2.4h9A1.5 1.5 0 0 1 21 9.9v8.6A1.5 1.5 0 0 1 19.5 20h-15A1.5 1.5 0 0 1 3 18.5v-11Z" />
        </symbol>
        <symbol id="i-search" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="6.2" />
          <path d="m20 20-3.8-3.8" />
        </symbol>
        <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" /></symbol>
        <symbol id="i-edit" viewBox="0 0 24 24">
          <path d="M4 20h4l10-10-4-4L4 16v4Z" />
          <path d="m14.5 5.5 4 4" />
        </symbol>
        <symbol id="i-trash" viewBox="0 0 24 24">
          <path d="M4 7h16M9.5 7V5h5v2M6.5 7l1 13h9l1-13" />
        </symbol>
        <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5" /></symbol>
        <symbol id="i-warn" viewBox="0 0 24 24">
          <path d="M12 4 2.8 20h18.4L12 4Z" />
          <path d="M12 10v4.2M12 17.3v.1" />
        </symbol>
        <symbol id="i-info" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="8.5" />
          <path d="M12 11v5.5M12 7.8v.1" />
        </symbol>
        <symbol id="i-logout" viewBox="0 0 24 24">
          <path d="M14 5.5H6.5A1.5 1.5 0 0 0 5 7v10a1.5 1.5 0 0 0 1.5 1.5H14" />
          <path d="M17.5 15.5 21 12l-3.5-3.5M20.5 12H10" />
        </symbol>
        <symbol id="i-chev-left" viewBox="0 0 24 24"><path d="m14.5 5-7 7 7 7" /></symbol>
        <symbol id="i-chev-right" viewBox="0 0 24 24"><path d="m9.5 5 7 7-7 7" /></symbol>
        <symbol id="i-link" viewBox="0 0 24 24">
          <path d="M10.5 13.5a3.5 3.5 0 0 0 5 0l3-3a3.5 3.5 0 0 0-5-5l-1.6 1.6" />
          <path d="M13.5 10.5a3.5 3.5 0 0 0-5 0l-3 3a3.5 3.5 0 0 0 5 5l1.6-1.6" />
        </symbol>
        <symbol id="i-clock" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="8.5" />
          <path d="M12 7.5V12l3 1.8" />
        </symbol>
        <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
        <symbol id="i-refresh" viewBox="0 0 24 24">
          <path d="M20 12a8 8 0 1 1-2.5-5.8" />
          <path d="M20 4v4.5h-4.5" />
        </symbol>
        <symbol id="i-user" viewBox="0 0 24 24">
          <circle cx="12" cy="8.5" r="3.8" />
          <path d="M4.5 20.5a7.5 7.5 0 0 1 15 0" />
        </symbol>
        <symbol id="i-shield" viewBox="0 0 24 24">
          <path d="M12 3 20 6v5.5c0 4.7-3.4 8-8 9.5-4.6-1.5-8-4.8-8-9.5V6l8-3Z" />
        </symbol>
      </defs>
    </svg>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
